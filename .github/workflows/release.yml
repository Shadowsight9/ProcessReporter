name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version from tag
        id: version
        shell: bash
        run: scripts/release-version.sh

      - name: Build
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild -project ProcessReporter.xcodeproj \
            -scheme ProcessReporter \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.marketing_version }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail

          plist="build/Build/Products/Release/Statusa.app/Contents/Info.plist"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"

          test "$actual_version" = "$EXPECTED_VERSION"
          test "$actual_build" = "$EXPECTED_BUILD"

          echo "Verified Statusa $actual_version ($actual_build)"

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements ProcessReporter/ProcessReporter.entitlements \
            build/Build/Products/Release/Statusa.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Statusa.app

      - name: Create dmg
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          mkdir -p build/dmg-root
          cp -R build/Build/Products/Release/Statusa.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "Statusa" -srcfolder build/dmg-root -ov -format UDZO "build/Statusa-${RELEASE_TAG}-arm64.dmg"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/Statusa-${{ steps.version.outputs.release_tag }}-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
