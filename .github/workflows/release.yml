name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List directory
        run: ls -la

      - name: Build
        run: |
          xcodebuild -project ProcessReporter.xcodeproj \
            -scheme ProcessReporter \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements ProcessReporter/ProcessReporter.entitlements \
            build/Build/Products/Release/Statusa.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Statusa.app

      - name: Create dmg
        run: |
          mkdir -p build/dmg-root
          cp -R build/Build/Products/Release/Statusa.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "Statusa" -srcfolder build/dmg-root -ov -format UDZO "build/Statusa-${GITHUB_REF_NAME}-arm64.dmg"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/Statusa-${{ github.ref_name }}-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
